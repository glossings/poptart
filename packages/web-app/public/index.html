<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>poptart</title>
    <script>
      // Apply the saved theme before the stylesheet paints, so there's no flash of the default.
      document.documentElement.dataset.theme = localStorage.getItem('poptart-theme') ?? 'poptart';
    </script>
    <link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css" />
    <link rel="stylesheet" href="/vendor/codemirror/addon/hint/show-hint.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <header>
        <span class="logo"></span>
        <h1>poptart</h1>
        <span id="engineStatus" class="status">checking engine…</span>
        <div class="spacer"></div>
        <select id="themeSelect" title="color theme"></select>
        <button id="evalBtn" class="primary" title="Cmd/Ctrl + Enter">▶ eval</button>
        <button id="stopBtn" title="Cmd/Ctrl + .">■ stop</button>
      </header>

      <main>
        <div id="editorPane">
          <textarea id="editor" spellcheck="false">n("0 2 3")
  .scale("F minor")
  .s("Serum 2")
  .param("Filter 1 On", 1)
  .param("Filter 1 Freq", sine({ rate: 0.3 }).range(200, 5000))</textarea>
        </div>

        <aside>
          <section id="trackSection">
            <h2>track</h2>
            <div id="trackInfo" class="panel">no pattern evaluated yet</div>
          </section>

          <section id="paramsSection">
            <h2>params <span id="paramsCount" class="count"></span></h2>
            <input id="paramSearch" type="search" placeholder="filter params… (click a param to copy)" />
            <div id="paramList" class="panel list">evaluate a pattern to load its plugins’ parameters</div>
          </section>

          <section id="pluginsSection">
            <h2>plugins <button id="scanBtn" class="small">rescan</button></h2>
            <div id="pluginList" class="panel list">not scanned yet</div>
          </section>
        </aside>
      </main>

      <footer id="log"></footer>
    </div>

    <script src="/vendor/codemirror/lib/codemirror.js"></script>
    <script src="/vendor/codemirror/mode/javascript/javascript.js"></script>
    <script src="/vendor/codemirror/addon/edit/matchbrackets.js"></script>
    <script src="/vendor/codemirror/addon/edit/closebrackets.js"></script>
    <script src="/vendor/codemirror/addon/hint/show-hint.js"></script>
    <script src="/vendor/codemirror/addon/comment/comment.js"></script>
    <script src="/vendor/codemirror/addon/search/searchcursor.js"></script>
    <script src="/vendor/codemirror/keymap/sublime.js"></script>
    <script src="client.js"></script>
  </body>
</html>
