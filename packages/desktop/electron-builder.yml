# Packaging config for the desktop builds (PACKAGING.md, Stage 2).
#
# What is packaged is not the repository but `stage/`, a folder stage.js assembles from it first
# (`npm run pack` and `npm run dist` do both steps). The repository itself cannot be the app
# directory: electron-builder collects node_modules by walking package.json `dependencies`, of
# which a workspace root has none, and the workspace packages resolve by name only through
# symlinks, which a Windows installer cannot carry. stage.js explains the layout it builds; the
# short version is that the staged folder is a plain, flat, symlink-free Node app, which is the
# case electron-builder is built for. It also means `files` needs no globs: everything staged
# ships, and deciding what ships is stage.js's job, where it is unit-tested.
#
# The build also needs Apple Developer credentials it cannot be given here (see "Signing" below),
# so without them it produces an unsigned app.

appId: dev.glossing.poptart
productName: poptart
copyright: poptart contributors

# All of these resolve against the project directory - this folder, where the build runs - as do
# the entitlements and icon paths further down. Only `asarUnpack` is relative to the app.
directories:
  app: stage
  output: dist
  buildResources: build

# The staged package.json has no electron dependency to read a version from, so it is named
# here - the exact version package-lock.json installs, which stage.test.js holds it to: the app
# must ship the Electron the launcher runs in development, not a neighbor of it.
electronVersion: 44.4.3

# Nothing here needs compiling against Electron's headers. The one native module in the tree is
# serialport (osc pulls it in), which ships N-API prebuilds for darwin-x64+arm64 and win32-x64,
# and the server runs as plain Node (ELECTRON_RUN_AS_NODE) where those load as they are. A rebuild
# could only replace a working prebuild with whatever the build machine's toolchain produces.
npmRebuild: false

# No asar archive. The app is a plain Node server that hands other programs paths into itself:
# sclang is given sc/poptart.scd, the native helpers are spawned, the keylock UGen is copied out
# and the analysis worker is loaded, each by a path built from __dirname. Inside an archive those
# paths exist only to Electron's patched fs - sclang answered 'file ".../app.asar/.../poptart.scd"
# does not exist' - and asarUnpack does not help, because nothing rewrites a __dirname path to
# app.asar.unpacked. An archive buys faster reads of many small files, which this app does not do.
asar: false

mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch: [arm64, x64]
  # scsynth opens the audio device for input as well as output, which macOS treats as microphone
  # access - without this key the prompt cannot be shown and the engine fails to boot.
  extendInfo:
    NSMicrophoneUsageDescription: poptart's audio engine opens your audio device, which macOS counts as microphone access.
    # Asked the first time anything in the app reaches for the local network. Ableton Link is the
    # part of poptart that does so by design - its peers find each other over multicast.
    NSLocalNetworkUsageDescription: poptart uses the local network for Ableton Link, to find and sync with other Link apps. Nothing else needs it.
    NSAudioCaptureUsageDescription: poptart's audio engine opens your audio device for input as well as output.
  # Signing: poptart's own native helpers (native/bin/poptart-audio, native/link/bin/poptart-link,
  # native/rubberband/bin/PoptartPitchShift.scx) are ad-hoc signed today and must be re-signed
  # with a Developer ID for distribution. hardenedRuntime + these entitlements are what SC's own
  # binaries ship with, and disable-library-validation is not optional: loading third-party VSTs
  # is the point of the program.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # No identity is named here, so whether a build is signed is decided by where it runs. The
  # release workflow passes the certificate as CSC_LINK / CSC_KEY_PASSWORD (and the APPLE_API_*
  # key that makes electron-builder notarize what it signed) when those secrets exist, and sets
  # CSC_IDENTITY_AUTO_DISCOVERY=false when they do not. A local build signs with a Developer ID
  # certificate if the keychain has one and is otherwise unsigned - fine for running it here,
  # useless for giving to anyone (PACKAGING.md).

dmg:
  artifactName: poptart-${version}-${arch}.dmg

# Icons: build/icon.png is picked up by name for macOS (converted to .icns); Windows gets the
# full-bleed variant. Both are drawn by build/make-icon.js.
win:
  icon: build/icon-win.png
  target:
    - target: nsis
      arch: [x64]
    # The same app, not installed: unpack it anywhere. This is the build for portable mode (a
    # `poptart-data` folder beside poptart.exe holds everything - see portable.js), because an
    # installed copy's folder belongs to its uninstaller.
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: poptart-${version}-setup.exe
  # Uninstalling offers to delete poptart's data folder too - mainly because of the ~600 MB
  # SuperCollider it downloaded on first run, which nobody asked to keep. It defaults to keeping
  # it, and an upgrade never asks. See build/uninstall.nsh.
  include: build/uninstall.nsh

# SuperCollider is NOT bundled. The app fetches SuperCollider's own officially signed release on
# first run instead (osc-engine/private-sc.js), which keeps this download small and means we are
# not redistributing and re-signing another project's binaries. PACKAGING.md Stage 2 discusses
# the alternative.
